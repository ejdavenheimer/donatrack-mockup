        <!-- MITAD DERECHA: Formulario de Login -->
        <section class="split-right">
            <!-- Botón Volver -->
            <div class="top-action">
                <a href="index.html" class="btn-volver" aria-label="Volver a la página principal">« Volver</a>
            </div>

            <div class="registro-container">
                <!-- Título actualizado -->
                <h2>Ingresar</h2>

                <!-- Formulario -->
                <form action="#" method="POST" class="registro-form" id="form-ingresar">
                    
                    <div class="form-group">
                        <label for="email" class="sr-only">Email</label>
                        <input type="email" id="email" name="email" class="pill-input" placeholder="Email" required>
                    </div>

                    <!-- Grupo de contraseña con el ícono del ojo -->
                    <div class="form-group password-group">
                        <label for="password" class="sr-only">Contraseña</label>
                        <input type="password" id="password" name="password" class="pill-input" placeholder="Contraseña" required>
                        <button type="button" class="btn-eye" id="toggle-password" aria-label="Mostrar contraseña" title="Mostrar contraseña">
                            <!-- Ícono de ojo simple (podes cambiarlo por un SVG real si querés) --><svg aria-hidden="true" class="lucide lucide-eye" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" /> <circle cx="12" cy="12" r="3" /> </svg></button>
                    </div>

                    <!-- Enlace de recuperar contraseña alineado a la derecha -->
                    <div class="forgot-password">
                        <a href="#">¿Olvidaste la contraseña?</a>
                    </div>

                    <!-- Botón Confirmar outline -->
                    <button type="submit" class="btn-outline-dark" id="btn-ingresar" style="margin-top: 15px;">
                        <span class="btn-spinner" hidden aria-hidden="true"></span>
                        <span class="btn-ingresar-texto">Confirmar</span>
                    </button>
                </form>

                <div class="registro-footer">
                    <a href="crear-cuenta.html">No tengo cuenta</a>
                </div>
            </div>
        </section>

    </main>

    <!-- script para alternar la visibilidad de la contraseña -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const togglePassword = document.getElementById('toggle-password');
            const passwordInput = document.getElementById('password');

            togglePassword.addEventListener('click', () => {
                // Cambia el tipo de input entre 'password' y 'text'
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                // Actualiza accesibilidad y aspecto visual
                if (type === 'text') {
                    togglePassword.setAttribute('aria-label', 'Ocultar contraseña');
                    togglePassword.setAttribute('title', 'Ocultar contraseña');
                    togglePassword.style.opacity = '1';
                } else {
                    togglePassword.setAttribute('aria-label', 'Mostrar contraseña');
                    togglePassword.setAttribute('title', 'Mostrar contraseña');
                    togglePassword.style.opacity = '0.5';
                }
            });
        });
    </script>

    <script src="toast.js"></script>
    <script>
        document.getElementById("form-ingresar").addEventListener("submit", function (e) {
            e.preventDefault();
            var btn = document.getElementById("btn-ingresar");
            if (btn.disabled) return;
            btn.disabled = true;
            btn.querySelector(".btn-spinner").hidden = false;
            btn.querySelector(".btn-ingresar-texto").textContent = "Ingresando…";

            setTimeout(function () {
                DonaToast.show("¡Bienvenido/a de nuevo!", "exito");
                setTimeout(function () { window.location.href = "index.html"; }, 700);
            }, 900);
        });
    </script>
