<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DonaTrack - Mapa de Donaciones</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- BARRA DE NAVEGACIÓN -->
    <header class="navbar">
        <div class="logo">
            <span class="logo-icon"><span class="logo-img" role="img" aria-label="Logo DonaTrack"></span></span>
            <h1>DonaTrack</h1>
        </div>
        <nav aria-label="Navegación principal">
            <div class="mobile-drawer">
            <div class="mobile-drawer-title"><h3>Menú</h3><button type="button" class="menu-cerrar" aria-label="Cerrar menú"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="donaciones.html" class="active" aria-current="page">Donaciones</a></li>
                <li><a href="crear-cuenta.html">Crear cuenta</a></li>
                <li><a href="ingresar.html">Ingresar</a></li>
            </ul>
        </div>
        </nav>
    <button type="button" class="menu-toggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="nav-links"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16"/><path d="M4 6h16"/><path d="M4 18h16"/></svg></button>
    </header>

    <main class="page-container">
        <!-- ENCABEZADO -->
        <header class="section-top">
            <div class="section-info">
                <h2>Donaciones</h2>
                <!-- Subtítulo actualizado según tu mockup -->
                <p>Explora el mapa para encontrar puntos de recolección y organizaciones que necesitan tu ayuda cerca de ti.</p>
            </div>
            
            <!-- Selector de Vista (Ahora son enlaces) -->
            <div class="view-toggle" role="group" aria-label="Cambiar vista">
                <a href="donaciones.html" class="toggle-btn" aria-pressed="false" style="text-decoration: none;">
                    <span aria-hidden="true"><svg aria-hidden="true" class="lucide lucide-layout-grid" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <rect width="7" height="7" x="3" y="3" rx="1" /> <rect width="7" height="7" x="14" y="3" rx="1" /> <rect width="7" height="7" x="14" y="14" rx="1" /> <rect width="7" height="7" x="3" y="14" rx="1" /> </svg></span> Tarjeta
                </a>
                <!-- El mapa ahora es el activo -->
                <a href="donaciones-mapa.html" class="toggle-btn active" aria-pressed="true" style="text-decoration: none;">
                    <span aria-hidden="true"><svg aria-hidden="true" class="lucide lucide-map" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z" /> <path d="M15 5.764v15" /> <path d="M9 3.236v15" /> </svg></span> Mapa
                </a>
            </div>
        </header>

        <!-- CONTENEDOR DEL MAPA -->
        <section class="map-container" aria-label="Mapa interactivo de donaciones">
            <iframe class="map-iframe" src="https://www.openstreetmap.org/export/embed.html?bbox=-58.4550%2C-34.6450%2C-58.3550%2C-34.5650&layer=mapnik" title="Mapa interactivo de Buenos Aires" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            <!-- Pines de ejemplo posicionados con porcentajes -->
            <div class="map-pin" style="top: 40%; left: 30%;" aria-label="Punto de recolección Centro"><svg aria-hidden="true" class="lucide lucide-map-pin" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0" /> <circle cx="12" cy="10" r="3" /> </svg></div>
            <div class="map-pin" style="top: 60%; left: 75%;" aria-label="Punto de recolección Norte"><svg aria-hidden="true" class="lucide lucide-map-pin" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0" /> <circle cx="12" cy="10" r="3" /> </svg></div>
            <div class="map-pin" style="top: 70%; left: 55%;" aria-label="Punto de recolección Sur"><svg aria-hidden="true" class="lucide lucide-map-pin" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0" /> <circle cx="12" cy="10" r="3" /> </svg></div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-left">
            <p>© 2026 DonaTrack - UTN Solidaria</p>
        </div>
        <div class="footer-right">
            <a href="#">Términos y Condiciones</a>
            <a href="#">Política de Privacidad</a>
            <a href="#">Contacto</a>
        </div>
    </footer>

    <script src="mobile-menu.js"></script>
</body>
</html>
