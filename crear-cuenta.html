<!DOCTYPE html>
<html lang="es">

        </section>

        <!-- MITAD DERECHA: Formulario -->
        <section class="split-right">
            <!-- Botón Volver -->
            <div class="top-action">
                <a href="index.html" class="btn-volver" aria-label="Volver a la página principal">« Volver</a>
            </div>

            <div class="registro-container">
                <h2>Registro</h2>

                <!-- Selector de Rol (Donador / Beneficiario) -->
                <div class="role-toggle" role="radiogroup" aria-label="Tipo de cuenta">
                    <button type="button" id="btn-donador" class="role-btn active" role="radio" aria-checked="true">Donador</button>
                    <button type="button" id="btn-beneficiario" class="role-btn" role="radio" aria-checked="false">Beneficiario</button>
                </div>

                <!-- Formulario -->
                <form action="#" method="POST" class="registro-form" id="form-crear-cuenta">

                    <!-- Esto es lo que lee el backend -->
                    <input type="hidden" id="tipo_cuenta" name="tipo_cuenta" value="donador">

                    <div class="form-group">
                        <label for="nombre" class="sr-only">Nombre</label>
                        <input type="text" id="nombre" name="nombre" class="pill-input" placeholder="Nombre" required>
                    </div>

                    <div class="form-group">
                        <label for="apellido" class="sr-only">Apellido</label>
                        <input type="text" id="apellido" name="apellido" class="pill-input" placeholder="Apellido" required>
                    </div>

                    <div class="form-group">
                        <label for="email" class="sr-only">Email</label>
                        <input type="email" id="email" name="email" class="pill-input" placeholder="Email" required>
                    </div>

                    <div class="form-group">
                        <label for="password" class="sr-only">Contraseña</label>
                        <input type="password" id="password" name="password" class="pill-input" placeholder="Contraseña" required>
                    </div>

                    <div class="form-checkbox">
                        <input type="checkbox" id="terminos" name="terminos" required>
                        <label for="terminos">Acepto los términos y condiciones</label>
                    </div>

                    <button type="submit" class="btn-outline-dark" id="btn-crear-cuenta">
                        <span class="btn-spinner" hidden aria-hidden="true"></span>
                        <span class="btn-crear-cuenta-texto">Confirmar</span>
                    </button>
                </form>

                <div class="registro-footer">
                    <a href="#">Ya tengo cuenta</a>
                </div>
            </div>
        </section>

    </main>
<!-- SCRIPT PARA GESTIONAR EL TIPO DE CUENTA -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnDonador = document.getElementById('btn-donador');
            const btnBeneficiario = document.getElementById('btn-beneficiario');
            const inputTipoCuenta = document.getElementById('tipo_cuenta');

            // Función para cambiar a Donador
            btnDonador.addEventListener('click', () => {
                // Cambios visuales y de accesibilidad
                btnDonador.classList.add('active');
                btnDonador.setAttribute('aria-checked', 'true');
                
                btnBeneficiario.classList.remove('active');
                btnBeneficiario.setAttribute('aria-checked', 'false');

                // Actualiza el valor del formulario para el backend
                inputTipoCuenta.value = 'donador';
                
                // NOTA FUTURA: Si luego agregás campos distintos, acá podés ocultarlos/mostrarlos
            });

            // Función para cambiar a Beneficiario
            btnBeneficiario.addEventListener('click', () => {
                // Cambios visuales y de accesibilidad
                btnBeneficiario.classList.add('active');
                btnBeneficiario.setAttribute('aria-checked', 'true');
                
                btnDonador.classList.remove('active');
                btnDonador.setAttribute('aria-checked', 'false');

                // Actualiza el valor del formulario para el backend
                inputTipoCuenta.value = 'beneficiario';
                
                // NOTA FUTURA: Si luego agregás campos distintos, acá podés ocultarlos/mostrarlos
            });
        });
    </script>

    <script src="toast.js"></script>
    <script>
        document.getElementById("form-crear-cuenta").addEventListener("submit", function (e) {
            e.preventDefault();
            var btn = document.getElementById("btn-crear-cuenta");
            if (btn.disabled) return;
            btn.disabled = true;
            btn.querySelector(".btn-spinner").hidden = false;
            btn.querySelector(".btn-crear-cuenta-texto").textContent = "Creando cuenta…";

            setTimeout(function () {
                DonaToast.show("Cuenta creada. ¡Bienvenido/a a DonaTrack!", "exito");
                setTimeout(function () { window.location.href = "ingresar.html"; }, 700);
            }, 900);
        });
    </script>
</body>
</html>
